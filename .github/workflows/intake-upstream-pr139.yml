name: Intake upstream PR 139 fix

on:
  pull_request:
    branches: [main]
    paths:
      - UPSTREAM_PR139_TRIGGER

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Cherry-pick upstream fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "halthinks-upstream-intake"
          git config user.email "268143618+halthinks@users.noreply.github.com"
          git remote add upstream-pr139 https://github.com/10-X-eng/vibecad.git
          git fetch upstream-pr139 7aa17d7854d93cc6fcfeba1ecf8f91e90431d77a
          git cherry-pick 7aa17d7854d93cc6fcfeba1ecf8f91e90431d77a
          git push origin HEAD:main
